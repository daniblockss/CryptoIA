name: CryptoIA checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q app start.py main.py
      - name: Validate Firebase JSON
        run: python -m json.tool firebase.rules.json > /dev/null && python -m json.tool firebase.json > /dev/null
